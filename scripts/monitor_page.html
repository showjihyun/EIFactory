<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팩토리 대시보드</title>
<link rel="icon" href="/assets/bolt_BUILDING.png">
<style>
:root {
  --bg: #F6F3EC; --surface: #FFFDF8; --sunken: #EFEBE2; --border: #E3DDD0;
  --text: #2B2A27; --muted: #77736A; --accent: #D97757; --shadow: 0 1px 0 rgba(0,0,0,.04), 0 2px 8px rgba(60,40,20,.07);
  --pass-bg: #DDF2E1; --pass: #2E7D43; --fail-bg: #FBDCD8; --fail: #B42318; --wait-bg: #ECEAE4;
  --low-bg: #ECEBE6; --low: #6B675E; --med-bg: #FFE8CC; --med: #B35C00; --high-bg: #FBD9D5; --high: #B42318;
  --s-queued: #6E66B8; --s-queued-bg: #ECEAF7;
  --s-spec: #5561C9; --s-spec-bg: #E7E9FB;
  --s-build: #3B7BC8; --s-build-bg: #E2EEFB;
  --s-retry: #B7791F; --s-retry-bg: #FCEFD9;
  --s-verify: #2F8C82; --s-verify-bg: #E6F3F1;
  --s-approval: #A77B00; --s-approval-bg: #FFF2CC;
  --s-approved: #3E8E52; --s-approved-bg: #E3F4E5;
  --s-merged: #7B5BB5; --s-merged-bg: #EEE6F8;
  --s-blocked: #C0453A; --s-blocked-bg: #FBE3E1;
  --s-error: #8E3B3B; --s-error-bg: #F2E4E4;
  --s-dropped: #8A867D; --s-dropped-bg: #EEECE8;
  --orch: #D97757; --builder: #3B7BC8; --reviewer: #2F8C82;
  --mono: ui-monospace, "Cascadia Code", "D2Coding", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1F1E1B; --surface: #2A2925; --sunken: #191815; --border: #3A3833;
    --text: #EDEAE3; --muted: #A9A59C; --accent: #E08A6D; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.35);
    --pass-bg: #1F3A27; --pass: #7BD98F; --fail-bg: #45231F; --fail: #FF8C80; --wait-bg: #34322D;
    --low-bg: #34322D; --low: #C9C4BA; --med-bg: #43301A; --med: #FFB866; --high-bg: #4A221E; --high: #FF8C80;
    --s-queued: #A39CF0; --s-queued-bg: #2D2B42; --s-spec: #8C97FF; --s-spec-bg: #282C4A;
    --s-build: #6FB4FF; --s-build-bg: #1F3248; --s-retry: #FFC266; --s-retry-bg: #3F3220;
    --s-verify: #5FD3C4; --s-verify-bg: #1D3936; --s-approval: #FFD34D; --s-approval-bg: #403617;
    --s-approved: #7BD98F; --s-approved-bg: #1F3A27; --s-merged: #C9A2FF; --s-merged-bg: #342A47;
    --s-blocked: #FF7A6E; --s-blocked-bg: #46231F; --s-error: #FF8C8C; --s-error-bg: #3D2424;
    --s-dropped: #B8B3A8; --s-dropped-bg: #34322D;
    --orch: #E08A6D; --builder: #6FB4FF; --reviewer: #5FD3C4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1F1E1B; --surface: #2A2925; --sunken: #191815; --border: #3A3833;
  --text: #EDEAE3; --muted: #A9A59C; --accent: #E08A6D; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.35);
  --pass-bg: #1F3A27; --pass: #7BD98F; --fail-bg: #45231F; --fail: #FF8C80; --wait-bg: #34322D;
  --low-bg: #34322D; --low: #C9C4BA; --med-bg: #43301A; --med: #FFB866; --high-bg: #4A221E; --high: #FF8C80;
  --s-queued: #A39CF0; --s-queued-bg: #2D2B42; --s-spec: #8C97FF; --s-spec-bg: #282C4A;
  --s-build: #6FB4FF; --s-build-bg: #1F3248; --s-retry: #FFC266; --s-retry-bg: #3F3220;
  --s-verify: #5FD3C4; --s-verify-bg: #1D3936; --s-approval: #FFD34D; --s-approval-bg: #403617;
  --s-approved: #7BD98F; --s-approved-bg: #1F3A27; --s-merged: #C9A2FF; --s-merged-bg: #342A47;
  --s-blocked: #FF7A6E; --s-blocked-bg: #46231F; --s-error: #FF8C8C; --s-error-bg: #3D2424;
  --s-dropped: #B8B3A8; --s-dropped-bg: #34322D;
  --orch: #E08A6D; --builder: #6FB4FF; --reviewer: #5FD3C4;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  font-size: 14px; line-height: 1.5;
}
.mono, code { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.wrap { margin: 0 auto; padding: 0 20px 80px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* 상단 바 */
.topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.topbar .wrap { display: flex; align-items: center; gap: 18px; padding-top: 10px; padding-bottom: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
.brand img { width: 34px; height: 34px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--border); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pass); display: inline-block; }
.dot.warn { background: var(--med); }
.spacer { flex: 1; }
.quota { display: inline-flex; gap: 2px; vertical-align: middle; }
.quota i { width: 9px; height: 9px; border-radius: 3px; background: var(--sunken); border: 1px solid var(--border); }
.quota i.on { background: var(--accent); border-color: var(--accent); }
.iconbtn { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 4px 10px; cursor: pointer; }
.banner { margin: 12px 0 0; padding: 10px 14px; border-radius: 12px; display: flex; gap: 10px; align-items: center; }
.banner.warn { background: var(--s-approval-bg); color: var(--s-approval); }
.banner.danger { background: var(--s-blocked-bg); color: var(--s-blocked); font-weight: 600; }
.banner img { width: 28px; height: 28px; }

h2 { font-size: 15px; margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; }
h2 .count { background: var(--s-approval-bg); color: var(--s-approval); border-radius: 999px; padding: 0 9px; font-size: 12px; }

/* 주의 줄 */
.attention { display: flex; gap: 12px; flex-wrap: wrap; }
.judge { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; }
.judge li { margin: 2px 0; }
.recommend { font-size: 12.5px; margin-top: 6px; }
.notify-btn { font-size: 12px; margin-left: 8px; padding: 2px 8px; border-radius: 8px; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer; }
.notify-btn[aria-pressed="true"] { opacity: .7; }
.acard { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 14px; width: 340px;
  border: 1px solid var(--border); cursor: pointer; animation: drop .35s cubic-bezier(.3,1.6,.5,1) both; }
.acard:hover { transform: translateY(-1px); }
.acard.k-approval { border-color: var(--s-approval); background: linear-gradient(180deg, var(--s-approval-bg), var(--surface) 60%); }
.acard.k-blocked { border-color: var(--s-blocked); background: linear-gradient(180deg, var(--s-blocked-bg), var(--surface) 60%); }
.acard.k-error { border-color: var(--s-error); background: linear-gradient(180deg, var(--s-error-bg), var(--surface) 60%); }
.ahead { display: flex; gap: 10px; align-items: center; }
.ahead img { width: 48px; height: 48px; flex: none; }
.atitle { font-weight: 700; }
.aline { margin-top: 6px; font-size: 12.5px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.empty-att { display: flex; gap: 10px; align-items: center; color: var(--muted); padding: 6px 0; }
.empty-att img { width: 40px; }
@keyframes drop { from { transform: translateY(-14px) scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }

/* 명령 상자 */
.cmd { display: flex; align-items: center; margin-top: 10px; background: var(--sunken); border-radius: 10px;
  border: 1px solid var(--border); overflow: hidden; }
.cmd code { flex: 1; padding: 6px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
.cmd button { border: 0; border-left: 1px solid var(--border); background: transparent; padding: 6px 10px; cursor: pointer; }
.cmd button.done { color: var(--pass); }

/* 요약 숫자 */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.stat { background: var(--surface); border-radius: 16px; padding: 12px 16px; box-shadow: var(--shadow); border: 1px solid var(--border); }
.stat .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .l { color: var(--muted); font-size: 12px; display: flex; gap: 6px; align-items: center; }
.miss { width: 7px; height: 7px; border-radius: 50%; background: var(--med); display: inline-block; }
.kpis { display: inline-flex; gap: 10px; align-items: center; font-size: 12px; font-variant-numeric: tabular-nums; }
.kpis > span { display: inline-flex; gap: 4px; align-items: center; }
.kpis b { font-weight: 700; }

/* 작업 레인 */
.lanes { background: var(--surface); border-radius: 16px; padding: 14px 16px 10px; box-shadow: var(--shadow); border: 1px solid var(--border); overflow-x: auto; }
.axis, .lane { display: grid; grid-template-columns: 150px 1fr 120px; align-items: center; gap: 10px; min-width: 760px; }
.axis .ticks { position: relative; height: 18px; font-size: 11px; color: var(--muted); }
.axis .ticks span { position: absolute; transform: translateX(-50%); }
.lane { padding: 5px 0; }
.lane .who { display: flex; gap: 6px; align-items: center; font-size: 12.5px; }
.lane .who img { width: 26px; height: 26px; }
.track { position: relative; height: 22px; background: var(--sunken); border-radius: 8px; }
.seg { position: absolute; top: 3px; height: 16px; border-radius: 6px; font-size: 10.5px; line-height: 16px; padding: 0 6px;
  overflow: hidden; white-space: nowrap; color: #fff; font-weight: 600; }
.seg.wait { background: transparent !important; border: 2px dashed var(--s-approval); color: var(--s-approval); line-height: 12px; }
.seg.wait.blocked { border-color: var(--s-blocked); color: var(--s-blocked); }
.seg.live { background-image: repeating-linear-gradient(-45deg, rgba(255,255,255,.22) 0 6px, transparent 6px 12px) !important;
  background-size: 17px 17px; animation: belt 1s linear infinite; }
.seg.live::after { content: "▶"; position: absolute; right: 3px; }
@keyframes belt { to { background-position: 17px 0; } }
.now { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--accent); border-radius: 2px; }
.lane .meta { font-size: 11.5px; color: var(--muted); }
.conflict { margin: 2px 0 6px 160px; font-size: 12px; color: var(--s-retry); display: flex; gap: 6px; align-items: center; }
.conflict b { color: var(--text); }
.lanes.closed { display: none; }
.fold { border: 0; background: transparent; cursor: pointer; font: inherit; font-weight: 700; padding: 0; display: inline-flex; gap: 6px; align-items: center; }
.lanes-foot { font-size: 11.5px; color: var(--muted); margin-top: 6px; display: flex; gap: 14px; flex-wrap: wrap; }

/* 보드 */
.board { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--sunken); border-radius: 16px; padding: 8px; min-height: 140px; flex: 1 1 0; min-width: 220px; }
.empty-stages { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.empty-stages:empty { display: none; }
.stage-chip { display: inline-flex; gap: 5px; align-items: center; padding: 2px 9px; border-radius: 999px; background: var(--sunken); border: 1px solid var(--border); }
.stage-chip .sd { width: 8px; height: 8px; border-radius: 50%; }
.board-empty { flex: 1; color: var(--muted); padding: 18px; text-align: center; background: var(--sunken); border-radius: 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(196px, 1fr)); gap: 8px; align-items: start; }
.cards .card { margin-bottom: 0; }
.col.hot { background: color-mix(in srgb, var(--s-approval-bg) 70%, var(--sunken)); }
.colhead { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12.5px; padding: 4px 6px 8px; }
.colhead .cnt { margin-left: auto; color: var(--muted); font-weight: 500; }
.colhead .sd { width: 9px; height: 9px; border-radius: 50%; }
.card { background: var(--surface); border-radius: 14px; padding: 9px; box-shadow: var(--shadow); margin-bottom: 8px;
  border: 1px solid var(--border); cursor: pointer; transition: transform .15s; }
.card:hover { transform: translateY(-1px); }
.card.sel { outline: 2px solid var(--accent); }
.chead { display: flex; align-items: center; gap: 6px; }
.chead img { width: 30px; height: 30px; }
.chead .id { font-weight: 700; font-family: var(--mono); }
.req { margin: 6px 0; font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meter { display: grid; grid-template-columns: 18px 1fr auto; gap: 6px; align-items: center; font-size: 11.5px; margin-top: 3px; }
.bar { height: 7px; background: var(--sunken); border-radius: 999px; overflow: hidden; position: relative; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--s-build); }
.bar > i.warn { background: var(--med); } .bar > i.over { background: var(--fail); }
.bar > i.est { background: repeating-linear-gradient(-45deg, var(--accent) 0 3px, color-mix(in srgb, var(--accent) 35%, transparent) 3px 6px); }
.bar > i.cost { background: var(--accent); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 7px; }
.chip { font-size: 10.5px; border-radius: 999px; padding: 1px 7px; font-weight: 600; }
.chip.PASS { background: var(--pass-bg); color: var(--pass); }
.chip.FAIL, .chip.BAD { background: var(--fail-bg); color: var(--fail); }
.chip.WAIT { background: var(--wait-bg); color: var(--muted); animation: blink 1.6s ease-in-out infinite; }
.chip.NONE { background: var(--wait-bg); color: var(--muted); }
@keyframes blink { 50% { opacity: .45; } }
.foot { display: flex; gap: 4px 6px; align-items: center; flex-wrap: wrap; margin-top: 7px; font-size: 11px; color: var(--muted); }
.foot > * { white-space: nowrap; }
.badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 700; }
.r-LOW { background: var(--low-bg); color: var(--low); }
.r-MEDIUM { background: var(--med-bg); color: var(--med); }
.r-HIGH { background: var(--high-bg); color: var(--high); font-weight: 800; }
.r-NONE { background: var(--wait-bg); color: var(--muted); }
.promo { background: var(--s-merged-bg); color: var(--s-merged); }
.trust { border-radius: 999px; padding: 0 7px; font-size: 10.5px; font-weight: 600; white-space: nowrap; }
.trust.session { border: 1px solid var(--s-approval); color: var(--s-approval); }
.trust.host { border: 1px solid var(--border); color: var(--muted); }
.trust.git { border: 1px solid var(--pass); color: var(--pass); }
.blocked-code { font-family: var(--mono); font-size: 11px; color: var(--s-blocked); font-weight: 700; }
.more { width: 100%; border: 1px dashed var(--border); background: transparent; border-radius: 10px; padding: 4px; cursor: pointer; color: var(--muted); }
.pop { animation: pop .6s ease-out; }
@keyframes pop { 0% { box-shadow: 0 0 0 0 var(--accent); } 100% { box-shadow: 0 0 0 10px transparent; } }
.bounce { animation: bounce 2s ease-in-out infinite; }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }

/* 드로어 */
.scrim { position: fixed; inset: 0; background: rgba(30,25,20,.25); z-index: 30; display: none; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 500px; max-width: 100%; background: var(--surface); z-index: 40;
  box-shadow: -8px 0 30px rgba(40,30,20,.18); transform: translateX(105%); transition: transform .25s ease; overflow-y: auto; }
.drawer.open { transform: none; }
.drawer.open + .scrim, .scrim.on { display: block; }
.dhead { display: flex; gap: 12px; padding: 18px 18px 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.dhead img { width: 64px; height: 64px; }
.dhead .t { font-weight: 800; font-size: 17px; }
.dhead .x { margin-left: auto; align-self: flex-start; }
.sec { padding: 12px 18px; border-bottom: 1px solid var(--border); }
.sec h3 { font-size: 13px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
.sec h3 .trust { margin-left: auto; }
.ev span { overflow-wrap: anywhere; }
.ev { display: grid; grid-template-columns: 96px 1fr; gap: 4px 10px; font-size: 12.5px; }
.ev .ok { color: var(--pass); font-weight: 700; } .ev .no { color: var(--fail); font-weight: 700; }
.ev .row-fail { background: var(--fail-bg); border-radius: 6px; padding: 0 6px; }
.rolebar { display: grid; grid-template-columns: 150px 1fr 60px; gap: 8px; align-items: center; font-size: 12.5px; margin: 4px 0; }
.rolebar .bar { height: 10px; }
.stage { display: flex; height: 12px; border-radius: 999px; overflow: hidden; margin-top: 6px; }
.stage i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--c) 0 4px, color-mix(in srgb, var(--c) 40%, transparent) 4px 8px); }
.hist { display: flex; flex-wrap: wrap; gap: 4px; font-size: 11.5px; }
.hist span { border-radius: 999px; padding: 1px 8px; }
.act { font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; word-break: break-all; }
.act div { padding: 2px 0; border-bottom: 1px dotted var(--border); }
details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
pre.raw { background: var(--sunken); border-radius: 10px; padding: 10px; font-size: 11.5px; white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow: auto; }

/* 토큰·모델 */
.tok { display: inline-flex; gap: 8px; align-items: center; font-size: 12px; font-variant-numeric: tabular-nums; }
.tok b { font-weight: 700; }
.tokline { font-size: 11px; color: var(--muted); margin-top: 3px; display: flex; gap: 6px; align-items: center; }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; display: inline-block; }
table.tt { width: 100%; border-collapse: collapse; font-size: 11.5px; font-variant-numeric: tabular-nums; }
table.tt th { text-align: right; color: var(--muted); font-weight: 600; padding: 3px 4px; border-bottom: 1px solid var(--border); }
table.tt th:first-child, table.tt td:first-child { text-align: left; }
table.tt td { text-align: right; padding: 4px; border-bottom: 1px dotted var(--border); white-space: nowrap; }
table.tt tr.sum td { font-weight: 700; border-bottom: 0; }
.hit-low { color: var(--med); font-weight: 700; }
.mix { display: flex; height: 8px; border-radius: 999px; overflow: hidden; margin: 8px 0 2px; }
.mix i { display: block; height: 100%; }
.legend { display: flex; gap: 10px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; background: var(--c); }
.mb { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 700; white-space: nowrap; }
.mb.haiku { background: #E4F5D6; color: #3F7A1F; } .mb.sonnet { background: #DDEBFB; color: #2F67A8; } .mb.opus { background: #EEE3FA; color: #6E4BB0; }
:root[data-theme="dark"] .mb.haiku { background: #263A1C; color: #A6E07E; } :root[data-theme="dark"] .mb.sonnet { background: #1F3248; color: #8CC4FF; } :root[data-theme="dark"] .mb.opus { background: #342A47; color: #CDB0FF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mb.haiku { background: #263A1C; color: #A6E07E; } :root:not([data-theme="light"]) .mb.sonnet { background: #1F3248; color: #8CC4FF; } :root:not([data-theme="light"]) .mb.opus { background: #342A47; color: #CDB0FF; } }
.src { font-size: 10.5px; border-radius: 999px; padding: 0 6px; border: 1px solid var(--border); color: var(--muted); }
.src.config { border-color: var(--accent); color: var(--accent); } .src.env, .src.cli { border-color: var(--text); color: var(--text); font-weight: 700; }
.stagerow { display: grid; grid-template-columns: 118px auto auto 1fr; gap: 6px; align-items: center; font-size: 12px; padding: 4px 0; border-bottom: 1px dotted var(--border); }
.stagerow .why { color: var(--muted); font-size: 11.5px; }
